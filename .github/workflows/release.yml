name: Release

# Publishing has stalled three times on local mechanics rather than on the code:
# 0.5.0 was tagged and never uploaded, 0.6.0's upload was abandoned after twine
# rejected a Metadata-Version 2.5 wheel, and 0.7.0 sat built-and-validated on a
# machine with no PyPI credentials. Tagging is the part that reliably happens, so
# the tag is what triggers the release.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere, in this
# repo or on a laptop. One-time setup on PyPI is required; see the checklist in
# docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify the tag matches the packaged version
        # A tag that disagrees with pyproject.toml publishes a version nobody
        # asked for, and it cannot be corrected after the fact — PyPI versions are
        # immutable. Fail here instead.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        # This is the check that caught 0.6.0: hatchling 1.32 emits
        # Metadata-Version 2.5, which twine rejects outright. pyproject pins
        # hatchling<1.32 to keep artifacts at 2.4 — this asserts it held.
        run: python -m twine check dist/*

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; no secret involved
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
