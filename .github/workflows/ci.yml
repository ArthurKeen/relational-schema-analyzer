name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev + extras under test)
        run: |
          python -m pip install --upgrade pip
          # postgres: psycopg is imported eagerly by the PG connector module.
          # csv: polars backs the CSV connector. owl: rdflib for OWL round-trip tests.
          # dev pulls fakesnow + snowflake-connector-python for the always-on
          # Snowflake conformance tests (embedded emulator, no cloud).
          # mysql/mssql drivers are intentionally NOT installed so their
          # "missing driver" paths are tested. Live-DB tests are opt-in (see
          # integration.yml) and skip here because RUN_INTEGRATION is unset.
          python -m pip install -e ".[dev,postgres,csv,owl,duckdb,mcp]"

      - name: Ruff
        run: ruff check .

      # Added once the package type-checked clean (0 errors, no baseline). Before
      # that, docs/RELEASING.md told you to run mypy as a release gate while it had
      # 18 standing errors, so it was always skipped — a checklist step that cannot
      # pass is worse than no step, because the document reads as if it ran. The one
      # time it was run properly it was reporting a real defect: SourceConnector
      # promised open_session, which four of nine connectors did not implement, so
      # the public factory's declared return type was false.
      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
